<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界时间地图 · 各地当前时间与昼夜</title>
<style>
  :root{
    --bg:#070b14;
    --panel:rgba(14,20,34,.78);
    --line:rgba(122,166,255,.16);
    --txt:#e8eefc;
    --dim:#8fa2c4;
    --amber:#f5b942;
    --blue:#6ea8fe;
    --accent:#43c6ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 700px at 18% -10%, #12203c 0%, transparent 60%),
      radial-gradient(1000px 600px at 92% 110%, #16233f 0%, transparent 55%),
      var(--bg);
    color:var(--txt);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1480px;margin:0 auto;padding:22px 22px 40px}

  /* 宽屏：铺满窗口，地图按可用高度取最大 2:1 尺寸（由 JS 量出来写死宽高） */
  @media (min-width:1100px){
    .app{
      max-width:none; margin:0; padding:14px 20px 12px;
      height:100vh; display:flex; flex-direction:column; gap:10px;
    }
    .app > header{margin-bottom:0; flex:0 0 auto}
    .app > .tools{flex:0 0 auto}
    .app > .foot{flex:0 0 auto; padding:2px 2px 0}
    .mapstage{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center}
    .mapwrap{width:100%; height:100%; aspect-ratio:auto}
  }

  /* ---------- 顶部 ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-bottom:16px}
  h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .sub{margin:5px 0 0;color:var(--dim);font-size:12.5px}

  .refbox{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:10px 16px;backdrop-filter:blur(8px)}
  .refmeta{font-size:11.5px;color:var(--dim);text-align:right;line-height:1.45}
  .refmeta b{color:var(--txt);font-weight:600;font-size:12.5px}
  #refClock{font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;letter-spacing:1px;line-height:1}
  #refClock small{font-size:13px;color:var(--dim);font-weight:400;margin-left:4px;letter-spacing:0}
  .reftabs{display:flex;gap:4px;margin-top:6px;justify-content:flex-end}
  .reftabs button{font:inherit;font-size:11px;padding:2px 8px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--dim);transition:.18s}
  .reftabs button:hover{color:var(--txt);border-color:rgba(122,166,255,.35)}
  .reftabs button.on{background:rgba(67,198,255,.14);border-color:rgba(67,198,255,.5);color:var(--accent)}

  /* ---------- 工具条 ---------- */
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font:inherit;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--dim);transition:.18s}
  .chip:hover{color:var(--txt);border-color:rgba(122,166,255,.35)}
  .chip.on{background:rgba(67,198,255,.13);border-color:rgba(67,198,255,.5);color:var(--accent)}
  .spacer{flex:1 1 auto}
  .toggles{display:flex;gap:8px;flex-wrap:wrap}
  .tg{font:inherit;font-size:12px;padding:5px 11px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--dim);transition:.18s;
    display:flex;align-items:center;gap:6px}
  .tg .dot{width:7px;height:7px;border-radius:50%;background:#40506a;transition:.18s}
  .tg.on{color:var(--txt);border-color:rgba(122,166,255,.4)}
  .tg.on .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .tg.link{text-decoration:none}
  .tg.link:hover{color:var(--accent);border-color:rgba(67,198,255,.5)}

  /* ---------- 地球视图 ---------- */
  #globeCv{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none}
  .mapwrap.globe #globeCv{display:block}
  .mapwrap.globe #map,.mapwrap.globe #mapTop,.mapwrap.globe #nightCv{display:none}
  .mapwrap.globe{cursor:default}
  .mapwrap.globe.dragging{cursor:grabbing}

  /* ---------- 城市搜索 ---------- */
  .search{position:relative;flex:0 0 auto}
  .search input{font:inherit;font-size:12.5px;width:172px;padding:6px 10px;border-radius:8px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);outline:none}
  .search input:focus{border-color:rgba(67,198,255,.55);background:rgba(67,198,255,.06)}
  .search input::placeholder{color:#5d6f8c}
  .search .results{position:absolute;top:calc(100% + 6px);right:0;width:252px;max-height:300px;overflow:auto;
    background:rgba(10,16,28,.985);border:1px solid var(--line);border-radius:10px;padding:5px;
    box-shadow:0 20px 44px -18px rgba(0,0,0,.95);display:none;z-index:60;backdrop-filter:blur(10px)}
  .search .results.show{display:block}
  .search .results button{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    width:100%;font:inherit;font-size:13px;padding:7px 9px;border-radius:7px;border:0;
    background:transparent;color:var(--txt);cursor:pointer;text-align:left}
  .search .results button:hover,.search .results button.on{background:rgba(67,198,255,.15)}
  .search .results span{color:var(--dim);font-size:11.5px;white-space:nowrap}
  .search .results .none{color:var(--dim);font-size:12px;padding:8px 10px}

  /* ---------- 地图 ---------- */
  .mapwrap{position:relative;width:100%;aspect-ratio:2/1;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);
    background:radial-gradient(140% 120% at 50% 0%,#101b30 0%,#0a1120 60%,#070b14 100%);
    box-shadow:0 24px 60px -30px rgba(0,0,0,.9), inset 0 0 80px rgba(20,40,80,.35)}
  #map,#mapTop{position:absolute;inset:0;display:block;width:100%;height:100%}
  #nightCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .35s}
  .mapwrap.hideNight #nightCv{opacity:0}
  /* 缩放中先隐藏城市标签（尺寸与避让需要重排），结束后统一恢复 */
  .mapwrap.zooming #cities text{opacity:0}
  /* 动画期间关掉圆点的 r 过渡，逐帧尺寸立即生效，屏幕上的点大小才不会忽大忽小 */
  .mapwrap.zooming #cities .city circle{transition:none}
  .mapwrap{touch-action:none;cursor:default;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .mapwrap.dragging{cursor:grabbing}
  .mapwrap text,.mapwrap circle,.mapwrap path{user-select:none;-webkit-user-select:none}

  #cities .city{cursor:pointer}
  #cities .city circle{transition:r .12s, opacity .18s}
  #cities .city text{pointer-events:none;transition:opacity .18s}
  #cities .city.dim{opacity:.16}

  /* ---------- 悬浮卡 ---------- */
  .tip{position:absolute;z-index:30;min-width:224px;max-width:300px;padding:12px 14px;border-radius:13px;
    background:rgba(9,14,26,.95);border:1px solid rgba(122,166,255,.28);
    box-shadow:0 18px 44px -12px rgba(0,0,0,.9);backdrop-filter:blur(14px);
    pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .13s, transform .13s}
  .tip.show{opacity:1;transform:translateY(0)}
  .cinfo .tname{font-size:15px;font-weight:650;letter-spacing:.3px}
  .cinfo .tname em{font-style:normal;color:var(--dim);font-size:11.5px;font-weight:400;margin-left:6px;letter-spacing:0}
  .cinfo .tregion{font-size:11px;color:var(--dim);margin-top:1px}
  .cinfo .tclock{font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;letter-spacing:.5px;line-height:1.15;margin-top:7px}
  .cinfo .tclock small{font-size:13px;color:var(--dim);font-weight:400;margin-left:3px}
  .cinfo .tdate{font-size:12.5px;color:#c8d6ef;margin-top:1px}
  .cinfo .trow{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--dim)}
  .tag.day{color:#ffd479;border-color:rgba(245,185,66,.4);background:rgba(245,185,66,.1)}
  .tag.night{color:#8fb8ff;border-color:rgba(110,168,254,.4);background:rgba(110,168,254,.1)}
  .cinfo .tsep{height:1px;background:var(--line);margin:9px 0}
  .tdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:.5px}
  .cinfo .tline{font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;gap:10px;margin-top:3px}
  .cinfo .tline b{color:#dbe6fa;font-weight:500;font-variant-numeric:tabular-nums}

  /* ---------- 底部 ---------- */
  .foot{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);align-items:center}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .pins{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pins .empty{font-size:11.5px;color:#5d6f8c}
  .pin{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 8px 5px 11px;border-radius:9px;
    background:rgba(255,255,255,.035);border:1px solid var(--line);font-variant-numeric:tabular-nums}
  .pin b{font-weight:600}
  .pin span{color:var(--dim);font-size:11px}
  .pin button{all:unset;cursor:pointer;color:#5d6f8c;font-size:13px;line-height:1;padding:1px 2px}
  .pin button:hover{color:#ff8f8f}

  /* ---------- 触屏底部卡片 ---------- */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;max-height:52vh;overflow:auto;
    transform:translateY(112%);transition:transform .3s cubic-bezier(.2,.85,.2,1);
    background:rgba(9,14,25,.975);border-top:1px solid rgba(122,166,255,.28);
    border-radius:20px 20px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -24px 60px -24px rgba(0,0,0,.95);backdrop-filter:blur(18px)}
  .sheet.open{transform:translateY(0)}
  .sheet .sheetHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sheet .sheetTitle{font-size:12px;color:var(--dim)}
  .sheet .sheetClose{all:unset;cursor:pointer;font-size:18px;line-height:1;color:#a8b8d4;padding:6px 12px;margin:-6px -6px -6px 0;border-radius:9px;background:rgba(255,255,255,.07)}
  .sheet .cand{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .sheet .cand button{display:flex;align-items:center;justify-content:space-between;gap:12px;
    font:inherit;font-size:15px;padding:14px 14px;border-radius:12px;cursor:pointer;text-align:left;
    background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--txt)}
  .sheet .cand button b{font-weight:600}
  .sheet .cand button span{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sheet .acts{display:flex;gap:10px;margin-top:14px}
  .sheet .acts button{flex:1;font:inherit;font-size:15px;padding:13px;border-radius:12px;cursor:pointer;
    border:1px solid rgba(67,198,255,.45);background:rgba(67,198,255,.14);color:var(--accent)}
  .sheet .acts button.ghost{border-color:var(--line);background:transparent;color:var(--dim)}
  .sheet .tipIn{margin:10px 0 0}
  @media (pointer:coarse){
    .tip{display:none}
    .chip,.tg{min-height:40px;padding:8px 15px;font-size:13px}
    .reftabs button{min-height:32px;padding:6px 12px}
    .pin{font-size:13px;padding:8px 10px}
    .pin button{font-size:17px;padding:4px 8px}
    .legend{font-size:12.5px}
  }
  /* ---------- 手机横屏：地图铺满整屏，控件浮在上面 ---------- */
  @media (max-height:560px) and (orientation:landscape){
    html,body{overflow:hidden;overscroll-behavior:none}
    /* 固定在视口内：手机浏览器地址栏显示/隐藏会改变可用高度，
       用 fixed + inset 把整页钉在可视区，避免 100vh 把顶部顶到地址栏下面 */
    .app{position:fixed;top:0;left:0;right:0;max-width:none;margin:0;padding:0;display:block;
      height:100vh;height:100dvh;height:var(--appH,100dvh);
      overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
    .mapstage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
    .mapwrap{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}

    header{position:absolute;top:0;left:0;right:0;z-index:20;margin:0;
      padding:calc(4px + env(safe-area-inset-top,0px))
              calc(10px + env(safe-area-inset-right,0px)) 6px
              calc(10px + env(safe-area-inset-left,0px));
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      background:linear-gradient(180deg,rgba(7,11,20,.88),rgba(7,11,20,0));
      pointer-events:none}
    header > *{pointer-events:auto}
    header h1{font-size:13px}
    header h1 span{display:none}
    header .sub{display:none}
    .refbox{padding:4px 9px;gap:9px;border-radius:10px;border-color:rgba(122,166,255,.22);
      background:rgba(10,16,28,.66)}
    .refmeta{font-size:9.5px;line-height:1.2}
    .refmeta b{font-size:10.5px}
    #refClock{font-size:17px;letter-spacing:.5px}
    #refClock small{font-size:9.5px;margin-left:3px}
    .reftabs{margin-top:2px;gap:3px}
    .reftabs button{font-size:9.5px;padding:0 6px;min-height:16px;border-radius:5px}

    .tools{position:absolute;left:0;right:0;bottom:24px;z-index:20;margin:0;
      padding:2px calc(10px + env(safe-area-inset-right,0px)) 6px
              calc(10px + env(safe-area-inset-left,0px));display:flex;flex-wrap:nowrap;align-items:center;gap:8px;
      background:linear-gradient(0deg,rgba(7,11,20,.9) 60%,rgba(7,11,20,0))}
    .search .results{top:auto;bottom:calc(100% + 6px)}
    .chips{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
      -webkit-overflow-scrolling:touch;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .spacer{display:none}
    .toggles{flex:0 0 auto;flex-wrap:nowrap;margin-left:auto}
    .chip,.tg{height:26px;padding:0 9px;font-size:11.5px;min-height:0;white-space:nowrap}
    .tg .dot{width:6px;height:6px}
    .search input{height:26px;padding:2px 7px;width:104px;font-size:11.5px}

    .foot{position:absolute;left:0;right:0;bottom:0;z-index:20;margin:0;
      padding:4px 10px calc(4px + env(safe-area-inset-bottom,0px));
      background:linear-gradient(0deg,rgba(7,11,20,.92),rgba(7,11,20,0));
      pointer-events:none}
    .foot > *{pointer-events:auto}
    .legend{font-size:10px;gap:9px}
    .legend i{width:6px;height:6px}
    .pins .empty{display:none}
    .pin{font-size:11px;padding:3px 6px 3px 8px}

    .sheet{max-height:74vh}
  }

  /* ---------- 竖屏提示 ---------- */
  .rotateHint{display:none}
  @media (max-width:900px) and (orientation:portrait){
    .rotateHint{display:flex;align-items:center;gap:7px;position:fixed;z-index:80;
      left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
      font-size:12px;color:var(--accent);background:rgba(67,198,255,.15);
      border:1px solid rgba(67,198,255,.45);border-radius:999px;padding:9px 15px;cursor:pointer;
      box-shadow:0 12px 26px -12px rgba(0,0,0,.9)}
    .rotateHint.hide{display:none}
  }

  @media (max-width:560px){
    #statLine{flex-basis:100%}
    .foot{gap:8px}
    .search{width:100%}
    .search input{width:100%}
    .search .results{left:0;right:auto;width:100%}
  }
  @media (max-width:820px){
    .app{padding:14px 12px 28px}
    h1{font-size:18px}
    #refClock{font-size:24px}
    .refbox{padding:8px 12px}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <h1>世界时间<span>地图</span></h1>
      <p class="sub">滚轮缩放 / 拖动平移 · 悬停城市查看当地时间 · 昼夜阴影随真实太阳位置实时移动 · 完全离线运行</p>
    </div>
    <div class="refbox">
      <div class="refmeta">
        <b id="refName">本地时间</b><br>
        <span id="refZone">Asia/Shanghai · UTC+8</span>
        <div class="reftabs" id="refTabs">
          <button data-ref="local" class="on">本地</button>
          <button data-ref="UTC">UTC</button>
        </div>
      </div>
      <div id="refClock">--:--:--<small>--</small></div>
    </div>
  </header>

  <div class="tools">
    <div class="chips" id="regionChips"></div>
    <div class="spacer"></div>
    <div class="toggles">
      <div class="search" id="searchBox">
        <input id="citySearch" type="text" placeholder="搜索城市…" autocomplete="off" spellcheck="false" aria-label="搜索城市">
        <div class="results" id="searchResults"></div>
      </div>
      <button class="tg on" id="tgNight"><span class="dot"></span>昼夜覆盖</button>
      <button class="tg on" id="tgLabels"><span class="dot"></span>名称标注</button>
      <button class="tg link" id="tgGlobe" title="在平面地图与三维地球之间切换">地球模式 ›</button>
      <button class="tg" id="tgLang" title="Switch language / 切换语言">EN</button>
    </div>
  </div>

  <div class="mapstage">
  <div class="mapwrap" id="mapwrap">
    <svg id="map" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#33475f"/>
          <stop offset="55%" stop-color="#2a3a50"/>
          <stop offset="100%" stop-color="#223044"/>
        </linearGradient>
      </defs>
      <g id="gGrid"></g>
      <path id="land" fill="url(#landGrad)" fill-rule="evenodd"
            stroke="#54708f" stroke-width=".55" stroke-linejoin="round"></path>
    </svg>
    <canvas id="nightCv" width="1080" height="540"></canvas>
    <svg id="mapTop" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="sunGrad">
          <stop offset="0%" stop-color="#ffd97a" stop-opacity=".42"/>
          <stop offset="45%" stop-color="#ffb84d" stop-opacity=".16"/>
          <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
        </radialGradient>
        <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="waters"></g>
      <g id="gSun">
        <circle id="sunGlow" r="40" fill="url(#sunGrad)"/>
        <circle id="sunCore" r="4.2" fill="#ffe6a8" filter="url(#softGlow)"/>
      </g>
      <g id="cities"></g>
    </svg>
    <canvas id="globeCv"></canvas>
    <div class="tip cinfo" id="tip"></div>
  </div>
  </div>

  <div class="foot">
    <div class="legend">
      <span><i style="background:#f5b942;box-shadow:0 0 8px #f5b942"></i>白天</span>
      <span><i style="background:#6ea8fe;box-shadow:0 0 8px #6ea8fe"></i>夜晚</span>
      <span><i style="background:#243a5c"></i>夜晚阴影</span>
      <span style="color:#5d6f8c">·</span>
      <span id="statLine">—</span>
    </div>
    <div class="pins" id="pins"><span class="empty">点击地图上的城市可钉住对比（最多 4 个）</span></div>
  </div>
</div>

<!-- 触屏：点选城市后的底部卡片 -->
<div class="rotateHint" id="rotateHint">↻ 横屏观看，地图更大</div>

<div class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-label="城市当地时间">
  <div class="sheetHead">
    <div class="sheetTitle" id="sheetTitle"></div>
    <button class="sheetClose" id="sheetClose" aria-label="关闭">×</button>
  </div>

  const a = Math.abs(min);

  return "UTC" + sign + h + (m ? ":" + String(m).padStart(2, "0") : "");
}

/* =========================================================
   4. 日出日落（对 24 小时区间扫描太阳高度，-0.833° 为地平线）
   ========================================================= */
const riseCache = new Map();
function riseSet(city, now) {
  const key = city.tz + "|" + city.la + "|" + Math.floor(now / 3600000);
  const hit = riseCache.get(key);
  if (hit) return hit;
  const s = sunGeom(now);
  let rise = null, set = null;
  let prevT = now - 12 * 3600000, prevA = sunAlt(city.la, city.lo, sunGeom(prevT));
  for (let t = now - 12 * 3600000 + 600000; t <= now + 12 * 3600000; t += 600000) {
    const a = sunAlt(city.la, city.lo, sunGeom(t));
    if (prevA < -0.833 * RAD && a >= -0.833 * RAD) rise = t;
    if (prevA >= -0.833 * RAD && a < -0.833 * RAD) set = t;
    prevA = a;
  }
  const altNow = sunAlt(city.la, city.lo, s);
  const res = { rise, set, alt: altNow };
  if (riseCache.size > 400) riseCache.clear();
  riseCache.set(key, res);
  return res;
}

   ========================================================= */
const cv = document.getElementById("nightCv");

let CW = cv.width, CH = cv.height;

/* 夜间层是位图，按显示尺寸 × 像素比重新分配，避免大屏被拉伸发虚。
   上限 1600×800：再大也只是渐变更细，但每帧像素数会翻倍，拖慢手势。 */
function sizeNightCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const host = document.getElementById("mapwrap");
  const cssW = host ? host.clientWidth : 0;
  const target = Math.round(Math.max(1080, Math.min(1600, (cssW || 1200) * Math.min(dpr, 1.5))));
  if (target === CW) return false;
  CW = target;
  CH = Math.round(target / 2);
  cv.width = CW;
  cv.height = CH;
  return true;
}
/* 两套查表：夜间遮罩（3° ~ -16° 平滑过渡）与白天暖光（0° ~ 26°） */
const LUT_N = new Uint8Array(1025);
const LUT_D = new Uint8Array(513);
(function buildLut() {
  const ss = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
  for (let i = 0; i <= 1024; i++) {
    const alt = Math.asin(Math.max(-1, Math.min(1, i / 512 - 1))) / RAD;
    LUT_N[i] = ss((3 - alt) / 19) * 150;      // 最暗时 150/255 ≈ 59% 不透明度
  }
  for (let i = 0; i <= 512; i++) {
    const alt = Math.asin(Math.max(-1, Math.min(1, i / 512))) / RAD;
    LUT_D[i] = ss(alt / 26) * 20;
  }
})();

function drawNight(now) {
  const s = sunGeom(now);
  const img = ctx.createImageData(CW, CH);
  const data = img.data;
  const sinDec = Math.sin(s.dec), cosDec = Math.cos(s.dec);
  const cosH = new Float64Array(CW), sinLat = new Float64Array(CH), cosLat = new Float64Array(CH);
  /* 只计算当前可视区域，放大后投影像素更细，不会糊 */
  for (let px = 0; px < CW; px++) {
    const x = vb.x + (px + 0.5) / CW * vb.w;
    const lon = x / W * 360 - 180;
    cosH[px] = Math.cos(s.st + lon * RAD - s.ra);
  }
  for (let py = 0; py < CH; py++) {
    const y = vb.y + (py + 0.5) / CH * vb.h;
    const lat = 90 - y / H * 180;
    sinLat[py] = Math.sin(lat * RAD);
    cosLat[py] = Math.cos(lat * RAD);
  }
  let idx = 0;
  for (let py = 0; py < CH; py++) {
    const A = sinLat[py] * sinDec, B = cosLat[py] * cosDec;
    for (let px = 0; px < CW; px++) {
      const sv = A + B * cosH[px];
      if (sv >= 0) {
        data[idx] = 255; data[idx + 1] = 226; data[idx + 2] = 168;
        data[idx + 3] = LUT_D[(sv * 512) | 0];
      } else {
        data[idx] = 5; data[idx + 1] = 10; data[idx + 2] = 27;
        data[idx + 3] = LUT_N[((sv + 1) * 512) | 0];
      }
      idx += 4;
    }
  }
  ctx.putImageData(img, 0, 0);
}

/* 只更新标记尺寸与可见性（每帧调用，尽量少写属性） */
let lastMk = -1, lastTier = 0;
function updateMarkers(v) {
  vb = v;
  const host = document.getElementById("mapwrap");
  const cw = host ? host.clientWidth : 0;
  const zoom = W / v.w;
  mk = Math.max(1, W / (cw || W)) / zoom * (coarse ? 1.18 : 1);   // 触屏上字与点再放大一点
  const pad = 44 * mk;

  /* 两级：全景只显示一级；放大到 3 倍以上才出现二级。
     双击一次是 2.2 倍（仍是一级），双击两次 4.84 倍（出二级），滚轮同一门槛。
     触屏另加一道闸：二级城市一屏超过上限就退回一级，按屏幕面积算（手机 ~40 座，平板基本不触发） */
  let tier = zoom >= 3.0 ? 2 : 1;
  const ch = host ? host.clientHeight : 0;
  const smallView = coarse || cw * ch < 420000;      // 触屏，或窗口本身很小
  if (tier === 2 && smallView) {
    const limit = Math.max(28, Math.min(160, Math.round((cw * ch) / 1600)));
    let cnt = 0;
    for (const n of cityNodes) {
      if (n.c.lv !== 2) continue;
      if (n.cx > v.x - pad && n.cx < v.x + v.w + pad &&
          n.cy > v.y - pad && n.cy < v.y + v.h + pad) {
        cnt++;
        if (cnt > limit) break;
      }
    }
    if (cnt > limit) tier = 1;
  }
  const resized = Math.abs(mk - lastMk) > 0.0008 || tier !== lastTier;
  lastMk = mk;
  lastTier = tier;

  const fs = BASE_FONT * mk;
  for (const n of cityNodes) {
    const vis = n.c.lv <= tier &&
      n.cx > v.x - pad && n.cx < v.x + v.w + pad &&
      n.cy > v.y - pad && n.cy < v.y + v.h + pad;
    if (vis === n._vis) {
      if (vis && resized) setMarkerSize(n, fs);
      continue;
    }
    n._vis = vis;
    n.g.style.display = vis ? "" : "none";
    if (vis) setMarkerSize(n, fs);
  }
  updateWaters();
}

function setMarkerSize(n, fs) {
  n.dot.setAttribute("r", (DOT_R * mk).toFixed(2));
  n.dot.setAttribute("stroke-width", (0.7 * mk).toFixed(2));
  n.halo.setAttribute("r", ((DOT_R + 3.4) * mk).toFixed(2));
  n.halo.setAttribute("stroke-width", (1.2 * mk).toFixed(2));
  /* 城市名统一用柔和的灰蓝，中英文同一字号，避免两套大小来回跳 */
  const fsz = fs * 0.84;
  n.label.setAttribute("font-size", fsz.toFixed(2));
  n.label.setAttribute("stroke-width", (fsz * 0.2).toFixed(2));
  n.label.setAttribute("fill", "rgba(186,203,228,.62)");
  n.label.setAttribute("x", (n.cx + 6.5 * mk).toFixed(2));
  n.label.setAttribute("y", (n.cy + 0.32 * fsz).toFixed(2));
}

function textWidth(str, size) {
  let w = 0;
  for (const ch of str) w += /[\u4e00-\u9fff\uff00-\uffef]/.test(ch) ? size : size * 0.56;

/* 标签避让：每个城市尝试右/左/下/上四个方位，按重要度依次安置 */
function layoutLabels() {
  cityNodes.forEach(n => { n.label.style.display = "none"; });
  if (!showLabels) return;
  const fs = BASE_FONT * mk * 0.84;   // 与 setMarkerSize 保持同一字号，避让框才准
  const gap = 5.5 * mk;
  /* 只处理当前可见、且未被大洲筛选排除的城市；中文模式下非中文名的城市只留点 */
  const visible = cityNodes.filter(n =>
    n._vis && (lang === "en" || !n.latin) &&
    (activeRegion === "全部" || n.c.co === activeRegion));

  /* 城市点位一起作为占位，避免标签压住别的城市 */
  const dots = visible.map(n => ({
    i: n.i, x: n.cx - (DOT_R + 0.6) * mk, y: n.cy - (DOT_R + 0.6) * mk,
    w: (DOT_R + 0.6) * 2 * mk, h: (DOT_R + 0.6) * 2 * mk
  }));
  const bigDots = dots.filter((d, k) => visible[k].c.lv === 1);
  const placedLabels = [];

  function candidates(n, w) {
    const seq = [
      { a: "start", x: n.cx + gap, y: n.cy + 0.32 * fs, bx: n.cx + gap },
      { a: "end", x: n.cx - gap, y: n.cy + 0.32 * fs, bx: n.cx - gap - w },
      { a: "middle", x: n.cx, y: n.cy + gap + fs * 0.82, bx: n.cx - w / 2 },
      { a: "middle", x: n.cx, y: n.cy - gap - fs * 0.12, bx: n.cx - w / 2 }
    ];
    return seq.map(c => {
      const above = c.y < n.cy;
      const box = { i: n.i, x: c.bx, y: above ? c.y - fs * 0.82 : c.y - fs * 0.72, w, h: fs * 1.15 };
      return { c, box };
    });
  }

  /* 标签数量按可视面积封顶：小屏上少放一些，否则密到看不清 */
  const capLabels = Math.max(14, Math.min(180,
    Math.round((wrap.clientWidth * wrap.clientHeight) / 2600)));
  let placedCount = 0;

  function tryPlace(n, base) {
    if (placedCount >= capLabels) return false;
    const w = textWidth(n.label.textContent || n.c.n, fs) + 2 * mk;
    const pad = fs * 0.14;                  // 标签之间留出实际间隙，避免糊成一片
    for (const cand of candidates(n, w)) {
      const b = cand.box;
      /* 越界判定跟随视野，不再用固定的 78 单位阈值 */
      if (b.x < vb.x + 1 || b.x + b.w > vb.x + vb.w - 1) continue;
      if (b.y < vb.y + 1 || b.y + b.h > vb.y + vb.h - 1) continue;
      const pb = { i: n.i, x: b.x - pad, y: b.y - pad, w: b.w + pad * 2, h: b.h + pad * 2 };
      /* 只避让其他标签；不再避让城市圆点，否则欧洲这种密集区里大城市名字会被挤掉 */
      const clash = placedLabels.some(p => p.i !== n.i &&
          pb.x < p.x + p.w && pb.x + pb.w > p.x && pb.y < p.y + p.h && pb.y + pb.h > p.y);
      if (clash) continue;
      n.label.setAttribute("text-anchor", cand.c.a);
      n.label.setAttribute("x", cand.c.x.toFixed(2));
      n.label.setAttribute("y", cand.c.y.toFixed(2));
      n.label.style.display = "";
      placedLabels.push(pb);
      placedCount++;
      return true;
    }
    return false;
  }

  /* 先给重点城市腾位置，再安置其余城市；同级里人口多的优先，保证巴黎、柏林这类大城市名字不被挤掉 */
  const order = visible.slice().sort((a, b) =>
    ((a.c.lv || 9) - (b.c.lv || 9)) || ((b.c.p || 0) - (a.c.p || 0)) || (a.i - b.i));
  const majors = order.filter(n => n.c.big);
  const rest = order.filter(n => !n.c.big);
  for (const n of majors) tryPlace(n, bigDots);
  for (const n of rest) tryPlace(n, dots);
}

/* 每帧更新的城市外观 */
function paintCities(now) {
  const s = sunGeom(now);
  let day = 0, night = 0, shown = 0;
  for (const n of cityNodes) {
    const c = n.c;
    /* 只对当前分级下可见的城市算昼夜，省掉大部分三角函数 */
    if (n._vis) {
      const a = sunAlt(c.la, c.lo, s) / RAD;
      const isDay = a > -0.833;
      shown++;
      if (isDay) day++; else night++;
      if (n.isDay !== isDay) {
        n.isDay = isDay;
        n.dot.setAttribute("fill", isDay ? "#f5b942" : "#6ea8fe");
      }
    }
    const dim = activeRegion !== "全部" && c.co !== activeRegion;
    if (n._dim !== dim) {
      n._dim = dim;
      n.g.classList.toggle("dim", dim);
    }
  }
  document.getElementById("statLine").textContent =
    T("stat", cityNodes.length, shown, day, night);
}

/* =========================================================
   8. 参考时间与时钟
   ========================================================= */
const refTabs = document.getElementById("refTabs");
let refZone = "local";
const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
function currentRefZone() { return refZone === "local" ? localZone : refZone; }

function renderRefClock(now) {
  const tz = currentRefZone();
  const p = partsIn(tz, now);
  const dt = lang === "en"
    ? new Intl.DateTimeFormat("en-US", { timeZone: tz, month: "short", day: "numeric" }).format(now)
    : `${p.year}/${p.month}/${p.day}`;
  const wd = lang === "en"
    ? new Intl.DateTimeFormat("en-US", { timeZone: tz, weekday: "short" }).format(now)
    : WD_ZH[WD[p.weekday]];
  document.getElementById("refClock").innerHTML =
    `${p.hour}:${p.minute}:${p.second}<small>${dt} ${wd}</small>`;
  const info = tzInfo(tz, now);
  document.getElementById("refName").textContent = refZone === "UTC" ? T("refUTC") : T("refLocal");
  document.getElementById("refZone").textContent =
    tz + " · " + fmtOffset(info.offset) + (info.dst ? T("dst") : "");
}

/* =========================================================
   9. 悬浮卡
   ========================================================= */
const tip = document.getElementById("tip");
const wrap = document.getElementById("mapwrap");
let hovered = null;

function cityTipHTML(n, now) {
  const c = n.c;
  const p = partsIn(c.tz, now);
  const info = tzInfo(c.tz, now);
  const rs = riseSet(c, now.getTime());
  const dayTag = n.isDay
    ? `<span class="tag day"><i class="tdot" style="background:#f5b942"></i>${T("day")}</span>`
    : `<span class="tag night"><i class="tdot" style="background:#6ea8fe"></i>${T("night")}</span>`;
  let rsTxt;
  if (rs.rise && rs.set) {
    const f = t => { const q = partsIn(c.tz, new Date(t)); return q.hour + ":" + q.minute; };
    rsTxt = `<div class="tline"><span>${T("riseSet")}</span><b>${f(rs.rise)} · ${f(rs.set)}</b></div>`;
  } else {
    const polarDay = sunAlt(c.la, c.lo, sunGeom(now.getTime())) > 0;
    rsTxt = `<div class="tline"><span>${T("polarTitle")}</span><b>${polarDay ? T("polarDay") : T("polarNight")}</b></div>`;
  }
  const refOff = tzInfo(currentRefZone(), now).offset;
  const diff = info.offset - refOff;
  const abs = Math.abs(diff);
  const hh = Math.floor(abs / 60), mm = abs % 60;
  let diffTxt;
  if (diff === 0) diffTxt = T("sameAsRef");
  else if (lang === "en") {
    diffTxt = `${hh ? hh + "h " : ""}${mm ? mm + "m " : ""}${diff > 0 ? T("earlier") : T("later")}`;
  } else {
    diffTxt = `${diff > 0 ? T("earlier") : T("later")} ${hh ? hh + T("hour") : ""}${mm ? mm + " 分" : ""}`;
  }
  const refLabel = refZone === "UTC" ? "UTC" : T("tabLocal");
  const alt = lang === "en"
    ? (c.e && c.n !== c.e ? c.n : "")        // 英文模式副标题显示中文名
    : (c.e && c.e !== c.n ? c.e : "");       // 中文模式副标题显示英文名
  return `
    <div class="tname">${cityName(c)}${alt ? `<em>${alt}</em>` : ""}</div>
    <div class="tregion">${countryName(c)} · ${regionName(c.co)}</div>
    <div class="tclock">${p.hour}:${p.minute}<small>:${p.second}</small></div>
    <div class="tdate">${dateText(c.tz, now)}</div>
    <div class="trow">${dayTag}<span class="tag">${fmtOffset(info.offset)}${info.dst ? T("dst") : ""}</span></div>
    <div class="tsep"></div>
    <div class="tline"><span>${T("relTo", refLabel)}</span><b>${diffTxt}</b></div>
    ${rsTxt}
    <div class="tline"><span>${T("alt")}</span><b>${(rs.alt / RAD).toFixed(1)}°</b></div>`;
}

function moveTip(ev) {
  const r = wrap.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = ev.clientX - r.left + 18;
  let y = ev.clientY - r.top + 16;
  if (x + tw > r.width - 8) x = ev.clientX - r.left - tw - 18;
  if (y + th > r.height - 8) y = Math.max(8, ev.clientY - r.top - th - 14);
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}

/* 命中半径：触屏取 44px（无障碍最小点按尺寸），鼠标 13px；
   边界由当前视野换算，缩放后依然按屏幕像素算 */
let coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches)
  || /[?&]touch=1/.test(location.search);      // ?touch=1 用于桌面/无头环境调试触屏布局
const mqCoarse = window.matchMedia ? window.matchMedia("(pointer: coarse)") : null;
if (mqCoarse) {
  const onMq = e => { coarse = e.matches; };
  if (mqCoarse.addEventListener) mqCoarse.addEventListener("change", onMq);
  else if (mqCoarse.addListener) mqCoarse.addListener(onMq);
}
function hitPx() { return coarse ? 44 : 13; }

/* 屏幕坐标 → 当前视野下的 SVG 坐标，并返回半径内的全部城市（近→远） */
function pickCandidates(ev) {
  const r = wrap.getBoundingClientRect();
  const sx = vb.x + (ev.clientX - r.left) / r.width * vb.w;
  const sy = vb.y + (ev.clientY - r.top) / r.height * vb.h;
  const radUser = hitPx() * vb.w / r.width;
  const hits = [];
  for (const n of cityNodes) {
    if (!n._vis) continue;                       // 只命中当前分级下已显示的城市
    if (activeRegion !== "全部" && n.c.co !== activeRegion) continue;
    const d = Math.hypot(n.cx - sx, n.cy - sy);
    if (d <= radUser) hits.push({ n, d });
  }
  hits.sort((a, b) => a.d - b.d);
  /* 只取最近的 6 个：44px 半径在未放大时可能覆盖整个欧洲，全部列出没有意义 */
  return hits.slice(0, 6).map(o => o.n);
}
function pickCity(ev) {
  const list = pickCandidates(ev);
  return list.length ? list[0] : null;
}

function highlight(n) {
  for (const x of cityNodes) if (x !== n) x.halo.setAttribute("opacity", "0");
  if (n) n.halo.setAttribute("opacity", ".95");
}
function setHover(n, ev) {
  if (coarse) return;                       // 触屏没有悬停语义
  if (hovered === n) { if (n) moveTip(ev); return; }
  hovered = n;
  highlight(n);
  if (n) {
    tip.innerHTML = cityTipHTML(n, new Date());
    tip.classList.add("show");
    moveTip(ev);
  } else {
    tip.classList.remove("show");
  }
}

/* =========================================================
   10. 钉住对比
   ========================================================= */
const pinsEl = document.getElementById("pins");
const pinned = [];
let EMPTY_PIN = `<span class="empty">${T("pinsEmpty")}</span>`;

function buildPins() {
  if (!pinned.length) { pinsEl.innerHTML = EMPTY_PIN; return; }
  pinsEl.innerHTML = pinned.map((c, i) =>
    `<div class="pin"><b>${c.n}</b> <span class="ptime"></span><span class="pdiff"></span>` +
    `<button data-k="${i}" title="移除">×</button></div>`).join("");
}
function renderPins(now) {
  if (!pinned.length) {
    if (!pinsEl.querySelector(".empty")) pinsEl.innerHTML = EMPTY_PIN;
    return;
  }
  if (pinsEl.children.length !== pinned.length) buildPins();
  const refOff = tzInfo(currentRefZone(), now).offset;
  pinned.forEach((c, i) => {
    const el = pinsEl.children[i];
    if (!el) return;
    const p = partsIn(c.tz, now);
    const d = tzInfo(c.tz, now).offset - refOff;
    el.querySelector(".ptime").textContent = p.hour + ":" + p.minute;
    el.querySelector(".pdiff").textContent = d === 0 ? "同步"
      : (d > 0 ? "快 " : "慢 ") + (Math.floor(Math.abs(d) / 60) ? Math.floor(Math.abs(d) / 60) + " 小时 " : "") +
        (Math.abs(d) % 60 ? Math.abs(d) % 60 + " 分" : "");
  });
}
pinsEl.addEventListener("click", e => {
  const k = e.target.getAttribute && e.target.getAttribute("data-k");
  if (k !== null && k !== undefined) {
    pinned.splice(+k, 1);
    buildPins();
    renderPins(new Date());
  }
});

function togglePin(n) {
  const i = pinned.indexOf(n.c);
  if (i >= 0) pinned.splice(i, 1);
  else { if (pinned.length >= 4) pinned.shift(); pinned.push(n.c); }
  buildPins();
  renderPins(new Date());
}

/* =========================================================
   10.5 触屏底部卡片（点选城市 / 密集区候选）
   ========================================================= */
const sheetEl = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");
const sheetTitle = document.getElementById("sheetTitle");
let sheetState = null;        // {type:"city", n} | {type:"cands", list}
let lastCandidates = [];

function renderSheet() {
  if (!sheetState) return;
  const now = new Date();
  const keepScroll = sheetEl.scrollTop;   // 每秒刷新时保留滚动位置
  if (sheetState.type === "cands") {
    sheetTitle.textContent = T("cands", sheetState.list.length);
    sheetBody.innerHTML = `<div class="cand">` + sheetState.list.map(n => {
      const p = partsIn(n.c.tz, now);
      const dot = `<i class="tdot" style="background:${n.isDay ? "#f5b942" : "#6ea8fe"}"></i>`;
      return `<button data-c="${n.i}"><b>${dot}${n.c.n}</b>` +
             `<span>${n.c.c} · ${p.hour}:${p.minute}</span></button>`;
    }).join("") + `</div>`;
  } else {
    const n = sheetState.n;
    const isPinned = pinned.indexOf(n.c) >= 0;
    sheetTitle.textContent = T("localTime");
    sheetBody.innerHTML = `<div class="tipIn cinfo">` + cityTipHTML(n, now) + `</div>` +
      `<div class="acts">` +
      `<button data-pin="${n.i}">${isPinned ? T("unpin") : T("pin")}</button>` +
      (lastCandidates.length > 1
        ? `<button class="ghost" data-back="1">换一个</button>`
        : `<button class="ghost" data-close="1">关闭</button>`) +
      `</div>`;
  }
  sheetEl.scrollTop = keepScroll;
}
function openSheet(state) {
  sheetState = state;
  renderSheet();
  sheetEl.classList.add("open");
  sheetEl.setAttribute("aria-hidden", "false");
  highlight(state.type === "city" ? state.n : null);
  hovered = state.type === "city" ? state.n : null;
}
function closeSheet() {
  sheetEl.classList.remove("open");
  sheetEl.setAttribute("aria-hidden", "true");
  highlight(null);
  hovered = null;
  sheetState = null;
}
sheetEl.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.c !== undefined) {
    openSheet({ type: "city", n: cityNodes[+b.dataset.c] });
  } else if (b.dataset.pin !== undefined) {
    togglePin(cityNodes[+b.dataset.pin]);
    renderSheet();
  } else if (b.dataset.back !== undefined) {
    openSheet({ type: "cands", list: lastCandidates });
  } else if (b.dataset.close !== undefined) {
    closeSheet();
  }
});
document.getElementById("sheetClose").addEventListener("click", closeSheet);

/* =========================================================
   10.8 缩放与拖拽
   ========================================================= */
const MIN_W = W / 6;                 // 最大放大 6 倍（视野宽 200）
let viewDirty = false, zooming = false;
let pointers = new Map();
let dragDist = 0, pinchDist = 0, lastPtr = null;
let shadeTimer = 0, lastShadeAt = 0;

function clampView(v) {
  const w = Math.max(MIN_W, Math.min(W, v.w));
  const h = w / 2;
  return {
    x: Math.max(0, Math.min(W - w, v.x)),
    y: Math.max(0, Math.min(H - h, v.y)),
    w, h
  };
}

/* 缩放期间的昼夜层重绘：节流到 ~90ms，避免每帧都算 58 万像素 */
function scheduleShade() {
  if (shadeTimer) return;
  const wait = Math.max(0, 90 - (performance.now() - lastShadeAt));
  shadeTimer = setTimeout(() => {
    shadeTimer = 0;
    lastShadeAt = performance.now();
    drawNight(Date.now());
  }, wait);
}
function flushShade() {
  if (shadeTimer) { clearTimeout(shadeTimer); shadeTimer = 0; }
  lastShadeAt = performance.now();
  drawNight(Date.now());
}

/* 统一的应用入口：钳制 → 写 viewBox → 更新标记 → 重绘节奏 */
function applyView(v, opt) {
  const nv = clampView(v);
  setViewBox(nv);
  updateMarkers(nv);
  placeSun(Date.now());
  viewDirty = true;
  if (opt && opt.zoom) {
    zooming = true;
    wrap.classList.add("zooming");
  }
  scheduleShade();
}

function zoomAt(factor, fx, fy) {
  const w2 = Math.max(MIN_W, Math.min(W, vb.w / factor));
  applyView({
    x: vb.x + fx * vb.w - fx * w2,
    y: vb.y + fy * vb.h - fy * (w2 / 2),
    w: w2, h: w2 / 2
  }, { zoom: true });
}

function panBy(dxPx, dyPx) {
  const r = wrap.getBoundingClientRect();
  if (!r.width) return;
  applyView({
    x: vb.x - dxPx / r.width * vb.w,
    y: vb.y - dyPx / r.height * vb.h,
    w: vb.w, h: vb.h
  }, null);
}

function endGesture() {
  wrap.classList.remove("dragging");
  if (!viewDirty) return;
  viewDirty = false;
  if (zooming) {
    zooming = false;
    wrap.classList.remove("zooming");
    layoutLabels();
  } else {
    layoutLabels();          // 平移后视野内新出现的城市需要补标签
  }
  flushShade();
  lastMk = -1;               // 下一帧强制刷新尺寸
}

function ptrDist() {
  const it = [...pointers.values()];
  return it.length < 2 ? 0 : Math.hypot(it[0].x - it[1].x, it[0].y - it[1].y);
}
function ptrMidFrac() {
  const it = [...pointers.values()];
  const r = wrap.getBoundingClientRect();
  return {
    fx: ((it[0].x + it[1].x) / 2 - r.left) / r.width,
    fy: ((it[0].y + it[1].y) / 2 - r.top) / r.height
  };
}

wrap.addEventListener("pointerdown", ev => {
  if (window.__mode === "globe") return;
  if (ev.button !== undefined && ev.button !== 0) return;
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  try { wrap.setPointerCapture(ev.pointerId); } catch (e) { /* 忽略 */ }
  if (pointers.size === 1) {
    dragDist = 0;
    lastPtr = { x: ev.clientX, y: ev.clientY };
    wrap.classList.add("dragging");
    if (!coarse) setHover(null);
  } else if (pointers.size === 2) {
    pinchDist = ptrDist();
  }
});

wrap.addEventListener("selectstart", ev => ev.preventDefault());

wrap.addEventListener("pointermove", ev => {
  if (window.__mode === "globe") return;
  const p = pointers.get(ev.pointerId);
  if (!p) {
    if (!coarse) setHover(pickCity(ev), ev);
    return;
  }
  const dx = ev.clientX - p.x, dy = ev.clientY - p.y;
  p.x = ev.clientX;
  p.y = ev.clientY;

  if (pointers.size === 1) {
    dragDist += Math.hypot(dx, dy);
    if (dragDist > 3) panBy(dx, dy);
  } else if (pointers.size === 2) {
    const d = ptrDist();
    if (pinchDist > 4 && d > 4) {
      const f = d / pinchDist;
      if (Math.abs(f - 1) > 0.004) {
        const m = ptrMidFrac();
        zoomAt(f, m.fx, m.fy);
      }
    }
    pinchDist = d;
    dragDist += Math.hypot(dx, dy);
  }
});

function releasePointer(ev) {
  if (window.__mode === "globe") return;
  if (!pointers.has(ev.pointerId)) return;
  pointers.delete(ev.pointerId);
  try { wrap.releasePointerCapture(ev.pointerId); } catch (e) { /* 忽略 */ }
  if (pointers.size === 1) {
    const it = [...pointers.values()][0];
    lastPtr = { x: it.x, y: it.y };
    pinchDist = 0;
  } else if (pointers.size === 0) {
    endGesture();
  }
}
wrap.addEventListener("pointerup", releasePointer);
wrap.addEventListener("pointercancel", releasePointer);

wrap.addEventListener("pointerleave", () => {
  if (!coarse && pointers.size === 0) setHover(null);
});

/* 滚轮缩放：以光标为锚点 */
wrap.addEventListener("wheel", ev => {
  if (window.__mode === "globe") return;
  ev.preventDefault();
  const r = wrap.getBoundingClientRect();
  if (!r.width) return;
  const fx = (ev.clientX - r.left) / r.width;
  const fy = (ev.clientY - r.top) / r.height;
  const factor = Math.exp(-ev.deltaY * (ev.deltaMode === 1 ? 0.05 : 0.0016));
  zoomAt(factor, fx, fy);
  clearTimeout(wheelEndTimer);
  wheelEndTimer = setTimeout(endGesture, 160);
}, { passive: false });
let wheelEndTimer = 0;

/* 双击放大 / 已放大时双击复位 */
wrap.addEventListener("dblclick", ev => {
  if (window.__mode === "globe") return;
  ev.preventDefault();
  const r = wrap.getBoundingClientRect();
  const fx = (ev.clientX - r.left) / r.width;
  const fy = (ev.clientY - r.top) / r.height;
  if (vb.w <= MIN_W + 1) { animateView({ x: 0, y: 0, w: W, h: H }); return; }
  const w2 = Math.max(MIN_W, vb.w / 2.2);
  animateView(clampView({
    x: vb.x + fx * vb.w - fx * w2,
    y: vb.y + fy * vb.h - fy * (w2 / 2),
    w: w2, h: w2 / 2
  }));
});

/* =========================================================
   10.9 城市搜索
   ========================================================= */
const searchEl = document.getElementById("citySearch");
const searchBoxEl = document.getElementById("searchBox");
const resultsEl = document.getElementById("searchResults");
const searchIndex = cityNodes.map(n => ({
  node: n,
  name: n.c.n,
  key: (n.c.n + " " + (n.c.e || "") + " " + n.c.c).toLowerCase()
}));
let searchHits = [], searchActive = -1;

function renderResults() {
  if (!searchHits.length) {
    resultsEl.innerHTML = `<div class="none">${T("noMatch")}</div>`;
  } else {
    resultsEl.innerHTML = searchHits.map((h, i) =>
      `<button data-i="${i}" class="${i === searchActive ? "on" : ""}">` +
      `<b>${h.node.c.n}</b><span>${h.node.c.c || h.node.c.co}</span></button>`).join("");
  }
  resultsEl.classList.add("show");
}
function hideResults() {
  resultsEl.classList.remove("show");
  searchActive = -1;
}
function doSearch(q) {
  q = (q || "").trim().toLowerCase();
  if (!q) { hideResults(); return; }
  searchHits = searchIndex
    .filter(x => x.key.indexOf(q) >= 0)
    .sort((a, b) => {
      const as = a.name.toLowerCase().startsWith(q) ? 0 : 1;
      const bs = b.name.toLowerCase().startsWith(q) ? 0 : 1;
      return as - bs || a.name.length - b.name.length ||
        ((b.node.c.p || 0) - (a.node.c.p || 0));
    })
    .slice(0, 8);
  searchActive = 0;
  renderResults();
}

/* 选中城市：直接跳到二级视野（不走动画，避免帧调度导致卡在中途） */
function focusCity(n) {
  hideResults();
  searchEl.value = n.c.n;
  if (window.__mode === "globe" && window.Globe) { Globe.focusCity(n.c); return; }
  if (activeRegion !== "全部") {          // 清掉大洲筛选，避免搜到的城市被过滤掉
    activeRegion = "全部";
    document.querySelectorAll("#regionChips .chip").forEach((c, i) =>
      c.classList.toggle("on", i === 0));
    paintCities(Date.now());
  }
  const w = 240, h = w / 2;
  applyView(clampView({ x: n.cx - w / 2, y: n.cy - h / 2, w: w, h: h }), null);
  zooming = false;
  wrap.classList.remove("zooming");
  lastMk = -1;
  updateMarkers(vb);
  layoutLabels();
  flushShade();
  highlight(n);
  hovered = n;
  if (coarse) {
    lastCandidates = [n];
    openSheet({ type: "city", n });
  } else {

/* ---------- 视野聚焦：按大洲包围盒缩放 ---------- */
/* 计算某大洲的包围盒（含留白），强制 2:1 宽高比，并限制最大放大倍数 */
function regionBox(co) {
  if (co === "全部") return { x: 0, y: 0, w: W, h: H };
  const lons = [], lats = [];
  for (const c of CITIES) {
    if (c.co !== co) continue;
    lons.push(c.lo);
    lats.push(c.la);
  }
  if (!lons.length) return { x: 0, y: 0, w: W, h: H };

  /* 经度按环形取最小跨度：跨 180° 的区域（大洋洲）否则会被算成包住整个地球 */
  const s = lons.slice().sort((a, b) => a - b);
  let gap = -1, gi = s.length - 1;
  for (let i = 0; i < s.length; i++) {
    const a = s[i];
    const b = (i === s.length - 1) ? s[0] + 360 : s[i + 1];
    if (b - a > gap) { gap = b - a; gi = i; }
  }
  const start = (gi === s.length - 1) ? s[0] : s[gi + 1];
  const span = Math.max(0, 360 - gap);

  let x0 = X(start), x1 = Math.min(W, x0 + span / 360 * W);
  if (span >= 359) { x0 = 0; x1 = W; }
  let y0 = Y(Math.max.apply(null, lats)), y1 = Y(Math.min.apply(null, lats));

  const padX = Math.max(30, (x1 - x0) * 0.12);
  const padY = Math.max(22, (y1 - y0) * 0.16);
  x0 -= padX; x1 += padX; y0 -= padY; y1 += padY;
  let w = x1 - x0, h = y1 - y0;
  const MIN_W = W / 5;                     // 最多放大 5 倍，避免单城市区域飞得太近
  if (w < MIN_W) { const c = (x0 + x1) / 2; w = MIN_W; x0 = c - w / 2; }
  if (h < MIN_W / 2) { const c = (y0 + y1) / 2; h = MIN_W / 2; y0 = c - h / 2; }
  if (w / h > 2) { h = w / 2; y0 = (y0 + y1) / 2 - h / 2; }
  else { w = h * 2; x0 = (x0 + x1) / 2 - w / 2; }
  if (w >= W - 0.5) { return { x: 0, y: 0, w: W, h: H }; }
  x0 = Math.max(0, Math.min(x0, W - w));
  y0 = Math.max(0, Math.min(y0, H - h));
  return { x: x0, y: y0, w, h };
}

function setViewBox(v) {
  const s = v.x.toFixed(1) + " " + v.y.toFixed(1) + " " + v.w.toFixed(1) + " " + v.h.toFixed(1);

let animTimer = 0, animSeq = 0;
function animateView(to) {
  clearInterval(animTimer);
  const from = { x: vb.x, y: vb.y, w: vb.w, h: vb.h };
  const target = clampView(to);
  if (Math.abs(from.w - target.w) < 0.5 && Math.abs(from.x - target.x) < 0.5 &&
      Math.abs(from.y - target.y) < 0.5) {
    /* 视野没变（比如点“大洋洲”被钳到全图后再点“全部”）：动画不会跑，
       但大洲筛选已经换人，标签必须立刻重排一次，否则旧筛选的标签会一直留着 */
    layoutLabels();
    return;
  }
  const seq = ++animSeq, t0 = performance.now(), dur = 420;
  const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  let done = false;
  function finish() {
    if (done) return;
    done = true;
    clearInterval(animTimer);
    if (seq === animSeq) {
      applyView(to, { zoom: true });
      zooming = false;
      wrap.classList.remove("zooming");
      flushShade();
      layoutLabels();
      lastMk = -1;
    }
  }
  function step() {
    if (seq !== animSeq) { clearInterval(animTimer); return; }
    const k = Math.min(1, (performance.now() - t0) / dur), e = ease(k);
    applyView({
      x: from.x + (to.x - from.x) * e,
      y: from.y + (to.y - from.y) * e,
      w: from.w + (to.w - from.w) * e,
      h: from.h + (to.h - from.h) * e
    }, { zoom: true });
    if (k >= 1) finish();
  }
  /* 用定时器驱动而不是 rAF：后台标签页与无头环境里 rAF 可能一直不执行，会把动画卡在中途 */
  animTimer = setInterval(step, 16);
  step();
  setTimeout(finish, dur + 180);
}

/* =========================================================
   13. 地球视图（与平面视图共用城市数据与时间逻辑）
   ========================================================= */
window.__mode = "flat";

const GC = document.getElementById("globeCv");
const gctx = GC.getContext("2d");

/* 把国界路径解析成经纬度环 */
const GRINGS = (function (d) {
  const rings = [];
  const tokens = (d || "").match(/[MLZ]|-?\d+(?:\.\d+)?/g) || [];
  let ring = null, i = 0;
  const toLonLat = (x, y) => [x / 1200 * 360 - 180, 90 - y / 600 * 180];
  while (i < tokens.length) {
    const tk = tokens[i];
    if (tk === "M" || tk === "L") {
      if (tk === "M") { ring = []; rings.push(ring); }
      i++;
      while (i + 1 < tokens.length &&
             tokens[i] !== "M" && tokens[i] !== "L" && tokens[i] !== "Z") {
        const x = +tokens[i++], y = +tokens[i++];
        if (ring) ring.push(toLonLat(x, y));
      }
    } else if (tk === "Z") { i++; ring = null; }
    else i++;
  }
  return rings.filter(r => r.length > 2);
})(window.WORLD_PATHS);

const gview = { lon: 105, lat: 22, zoom: 1 };
const G_MIN = 1, G_MAX = 6;
let gcx = 0, gcy = 0, gR = 1;
let glabels = [], gNightOn = true, gNeedLabels = true;
const gp = { x: 0, y: 0, z: 0 };

/* 正交投影：z>0 表示朝向相机 */
function gProject(lat, lon, out) {
  const la = lat * RAD, la0 = gview.lat * RAD, dl = (lon - gview.lon) * RAD;
  const cl = Math.cos(la), sl = Math.sin(la);
  const cl0 = Math.cos(la0), sl0 = Math.sin(la0);
  const cl_dl = cl * Math.cos(dl);
  out.x = gcx + gR * cl * Math.sin(dl);
  out.y = gcy - gR * (cl0 * sl - sl0 * cl_dl);
  out.z = sl0 * sl + cl0 * cl_dl;
  return out;
}

function gResize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = wrap.clientWidth, h = wrap.clientHeight;
  GC.width = Math.round(w * dpr);
  GC.height = Math.round(h * dpr);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gcx = w / 2; gcy = h / 2;
  gR = Math.min(w, h) * 0.44 * gview.zoom;
}

/* 昼夜遮罩：低分辨率离屏逐像素点积 */
const GN = 160;
const gNightCv = document.createElement("canvas");
gNightCv.width = gNightCv.height = GN;
const gNightCtx = gNightCv.getContext("2d");
const gNightImg = gNightCtx.createImageData(GN, GN);

function gViewPoint(lat, lon) {
  const la = lat * RAD, la0 = gview.lat * RAD, dl = (lon - gview.lon) * RAD;
  const cl = Math.cos(la), sl = Math.sin(la);
  const cl0 = Math.cos(la0), sl0 = Math.sin(la0);
  const cl_dl = cl * Math.cos(dl);
  return { x: cl * Math.sin(dl), y: cl0 * sl - sl0 * cl_dl, z: sl0 * sl + cl0 * cl_dl };
}

/* 经纬网：每 30° 一格，外加赤道 / 回归线 / 极圈 / 本初子午线 */
const G_EQUATOR = 0, G_TROPIC = 23.44, G_POLAR = 66.56;
function gDrawGrid() {
  const thin = "rgba(122,166,255,.10)";
  gctx.lineWidth = 0.8;
  gctx.strokeStyle = thin;

  /* 经线 */
  for (let lon = -180; lon < 180; lon += 30) {
    gctx.beginPath();
    let on = false;
    for (let lat = -88; lat <= 88; lat += 4) {
      const p = gProject(lat, lon, gp);
      if (p.z <= 0.03) { on = false; continue; }
      if (on) gctx.lineTo(p.x, p.y); else { gctx.moveTo(p.x, p.y); on = true; }
    }
    gctx.stroke();
  }
  /* 纬线（每 30°，赤道单独画） */
  for (let lat = -60; lat <= 60; lat += 30) {
    if (lat === 0) continue;
    gctx.beginPath();
    let on = false;
    for (let lon = -180; lon <= 180; lon += 3) {
      const p = gProject(lat, lon, gp);
      if (p.z <= 0.03) { on = false; continue; }
      if (on) gctx.lineTo(p.x, p.y); else { gctx.moveTo(p.x, p.y); on = true; }
    }
    gctx.stroke();
  }

  /* 特殊线 */
  const special = [
    { lat: G_EQUATOR,        color: "rgba(122,166,255,.34)", text: T("gEquator") },
    { lat: G_TROPIC,         color: "rgba(245,185,66,.28)",  text: T("gTropicN"), small: true },
    { lat: -G_TROPIC,        color: "rgba(245,185,66,.28)",  text: T("gTropicS"), small: true },
    { lat: G_POLAR,          color: "rgba(110,168,254,.26)", text: T("gPolarN") },
    { lat: -G_POLAR,         color: "rgba(110,168,254,.26)", text: T("gPolarS") }
  ];
  for (const sp of special) {
    gctx.beginPath();
    let on = false;
    for (let lon = -180; lon <= 180; lon += 3) {
      const p = gProject(sp.lat, lon, gp);
      if (p.z <= 0.03) { on = false; continue; }
      if (on) gctx.lineTo(p.x, p.y); else { gctx.moveTo(p.x, p.y); on = true; }
    }
    gctx.strokeStyle = sp.color;
    gctx.lineWidth = 1.1;
    gctx.stroke();
  }
  /* 本初子午线 */
  gctx.beginPath();
  {
    let on = false;
    for (let lat = -88; lat <= 88; lat += 4) {
      const p = gProject(lat, 0, gp);
      if (p.z <= 0.03) { on = false; continue; }
      if (on) gctx.lineTo(p.x, p.y); else { gctx.moveTo(p.x, p.y); on = true; }
    }
  }
  gctx.strokeStyle = "rgba(122,166,255,.24)";
  gctx.lineWidth = 1.1;
  gctx.stroke();

  /* 线的名字：在几个经度里挑一个附近没有城市名的位置 */
  if (!showLabels) return;
  const fsBase = gview.zoom > 2.4 ? 12 : 11;      // 固定屏幕字号，不随缩放变大
  gctx.textBaseline = "middle";
  gctx.textAlign = "center";
  gctx.lineWidth = 3;
  gctx.strokeStyle = "rgba(5,9,18,.85)";
  for (const sp of special) {
    const p = gFreeSpot(sp.lat, gview.lon, sp.small ? 32 : 26);
    if (!p) continue;
    /* 回归线名字更长，字号再小一档，免得压过赤道和极圈 */
    const fs = sp.small ? fsBase * 0.8 : fsBase;
    gctx.font = fs.toFixed(1) + "px 'Microsoft YaHei',system-ui,sans-serif";
    gctx.strokeText(sp.text, p.x, p.y - fs * 0.7);
    gctx.fillStyle = sp.color.replace(/[\d.]+\)$/, "0.78)");
    gctx.fillText(sp.text, p.x, p.y - fs * 0.7);
  }

  /* 度数标注：纬线靠左缘，经线沿赤道 */
  const fsDeg = 10;
  gctx.font = fsDeg + "px 'Segoe UI',system-ui,sans-serif";
  gctx.lineWidth = 2.6;
  gctx.strokeStyle = "rgba(5,9,18,.8)";
  gctx.fillStyle = "rgba(158,190,230,.6)";
  for (let lat = -60; lat <= 60; lat += 30) {
    if (lat === 0) continue;                       // 赤道有名字，不重复标度数
    let q = null;
    for (let d = 52; d <= 88; d += 3) {
      const p = gProject(lat, gview.lon - d, { x: 0, y: 0, z: 0 });
      if (p.z > 0.30) { q = p; break; }
    }
    if (!q) continue;
    const txt = Math.abs(lat) + "°" + (lat > 0 ? "N" : "S");
    gctx.strokeText(txt, q.x, q.y);
    gctx.fillText(txt, q.x, q.y);
  }
  for (let lon = -180; lon < 180; lon += 60) {
    if (lon === 0) continue;                       // 本初子午线有名字
    let q = null;
    for (const dLat of [0, -7, 7, -15, 15, -25, 25]) {
      const p = gProject(dLat, lon, { x: 0, y: 0, z: 0 });
      if (p.z > 0.35) { q = p; break; }
    }
    if (!q) continue;
    const abs = Math.abs(lon);
    const txt = abs === 180 ? "180°" : abs + "°" + (lon > 0 ? "E" : "W");
    gctx.strokeText(txt, q.x, q.y);
    gctx.fillText(txt, q.x, q.y);
  }
}

/* 在一条纬线上找一个「附近没有城市名」的位置，避免标注压住城市 */
function gFreeSpot(lat, baseLon, halfW) {
  const offsets = [0, -58, 58, -110, 110, -160, 160];
  const tier = gTier();
  const tmp = { x: 0, y: 0, z: 0 };
  let fallback = null;
  for (const off of offsets) {
    const q = gProject(lat, baseLon + off, { x: 0, y: 0, z: 0 });
    if (q.z <= 0.2) continue;
    let clash = false;
    for (const c of CITIES) {
      if (c.lv > tier) continue;
      const r = gProject(c.la, c.lo, tmp);
      if (r.z <= 0.1) continue;
      if (Math.abs(r.x - q.x) < halfW && Math.abs(r.y - q.y) < 9) { clash = true; break; }
    }
    if (!clash) return q;
    if (!fallback) fallback = q;
  }
  return fallback;
}

/* 水体名：与平面版共用 WATERS 与 WATER_EN，按同样的大洲尺度门槛显隐 */
function gDrawWaters() {
  if (!showLabels) return;
  /* 固定屏幕字号：放大时球体变大，但字不能跟着变大，否则地中海、里海会糊满一屏 */
  const fs = gview.zoom > 2.4 ? 12 : 11;
  gctx.font = fs + "px 'Microsoft YaHei',system-ui,sans-serif";
  gctx.textBaseline = "middle";
  gctx.textAlign = "center";
  gctx.lineWidth = 3;
  gctx.strokeStyle = "rgba(5,9,18,.85)";
  for (const wt of WATERS) {
    /* 平面版的判据是 vb.w <= wt.w；地球模式的等效视野宽 = 1200 / zoom */
    if (1200 / gview.zoom > wt.w) continue;
    const p = gProject(wt.la, wt.lo, gp);
    if (p.z <= 0.12) continue;
    const text = lang === "en" ? (WATER_EN[wt.n] || wt.n) : wt.n;
    const alpha = Math.min(1, p.z * 1.6) * 0.55;
    gctx.strokeText(text, p.x, p.y);
    gctx.fillStyle = "rgba(180,217,250," + alpha.toFixed(2) + ")";
    gctx.fillText(text, p.x, p.y);
  }
}

/* 太阳直射点：地球模式里明暗的源头，画成一个光斑 */
function gDrawSunSpot(nowMs) {
  const sl = sunLatLon(nowMs);
  const p = gProject(sl.lat, sl.lon, gp);
  if (p.z <= 0.02) return;
  const rr = Math.max(14, gR * 0.16);
  const k = Math.min(1, p.z * 1.6);
  const g2 = gctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
  g2.addColorStop(0, "rgba(255,236,180," + (0.75 * k) + ")");
  g2.addColorStop(0.35, "rgba(255,196,96," + (0.22 * k) + ")");
  g2.addColorStop(1, "rgba(255,180,80,0)");
  gctx.beginPath();
  gctx.arc(p.x, p.y, rr, 0, 6.2832);
  gctx.fillStyle = g2;
  gctx.fill();
  gctx.beginPath();
  gctx.arc(p.x, p.y, Math.max(2, gR * 0.006), 0, 6.2832);
  gctx.fillStyle = "rgba(255,242,200," + (0.9 * k) + ")";
  gctx.fill();
}

function gDrawNight(nowMs) {
  const sl = sunLatLon(nowMs);
  const sv = gViewPoint(sl.lat, sl.lon);
  const data = gNightImg.data;
  for (let py = 0; py < GN; py++) {
    const dy = (py + 0.5) / GN * 2 - 1;
    for (let px = 0; px < GN; px++) {
      const dx = (px + 0.5) / GN * 2 - 1;
      const r2 = dx * dx + dy * dy;
      const i = (py * GN + px) * 4;
      if (r2 > 1) { data[i + 3] = 0; continue; }
      const z = Math.sqrt(1 - r2);
      const d = dx * sv.x + (-dy) * sv.y + z * sv.z;
      let a = 1 - Math.min(1, Math.max(0, (d + 0.10) / 0.16));
      a = a * a * (3 - 2 * a);
      data[i] = 4; data[i + 1] = 8; data[i + 2] = 20;
      data[i + 3] = Math.round(a * 158);
    }
  }
  gNightCtx.putImageData(gNightImg, 0, 0);
  gctx.save();
  gctx.beginPath();
  gctx.arc(gcx, gcy, gR, 0, 6.2832);
  gctx.clip();
  gctx.imageSmoothingEnabled = true;
  gctx.drawImage(gNightCv, gcx - gR, gcy - gR, gR * 2, gR * 2);
  gctx.restore();
}

function gTier() { return gview.zoom >= 3 ? 2 : 1; }

function gRender() {
  const now = Date.now();
  gResize();
  gctx.clearRect(0, 0, wrap.clientWidth, wrap.clientHeight);

  /* 海洋球体 */
  const grad = gctx.createRadialGradient(gcx - gR * 0.3, gcy - gR * 0.35, gR * 0.1, gcx, gcy, gR * 1.02);
  grad.addColorStop(0, "#16273f");
  grad.addColorStop(0.65, "#0d182a");
  grad.addColorStop(1, "#070d18");
  gctx.beginPath();
  gctx.arc(gcx, gcy, gR, 0, 6.2832);
  gctx.fillStyle = grad;
  gctx.fill();

  /* 陆地 */
  gctx.beginPath();
  for (const ring of GRINGS) {
    let started = false;
    for (let i = 0; i < ring.length; i++) {
      const p = gProject(ring[i][1], ring[i][0], gp);
      if (p.z <= 0) continue;
      if (!started) { gctx.moveTo(p.x, p.y); started = true; }
      else gctx.lineTo(p.x, p.y);
    }
    if (started) gctx.closePath();
  }
  gctx.fillStyle = "#2c4058";
  gctx.fill("evenodd");
  gctx.strokeStyle = "#5d7fa6";
  gctx.lineWidth = 0.8;
  gctx.stroke();

  gDrawGrid();

  if (gNightOn) gDrawNight(now);
  gDrawSunSpot(now);
  gDrawWaters();

  /* 城市点 */
  const s = sunGeom(now);
  const tier = gTier();
  const dotR = gview.zoom > 2.4 ? 3.2 : 2.6;
  let shown = 0, dayCnt = 0;
  for (const c of CITIES) {
    if (c.lv > tier) { c._gz = -1; continue; }
    const p = gProject(c.la, c.lo, gp);
    c._gx = p.x; c._gy = p.y; c._gz = p.z;
    if (p.z <= 0.02) continue;
    const isDay = sunAlt(c.la, c.lo, s) > -0.833 * RAD;
    c._gDay = isDay;
    shown++; if (isDay) dayCnt++;
    const alpha = Math.min(1, p.z * 2.4);
    gctx.beginPath();
    gctx.arc(p.x, p.y, dotR, 0, 6.2832);
    gctx.fillStyle = isDay ? "rgba(245,185,66," + alpha + ")" : "rgba(110,168,254," + alpha + ")";
    gctx.fill();
    gctx.lineWidth = 1;
    gctx.strokeStyle = "rgba(6,10,20," + 0.7 * alpha + ")";
    gctx.stroke();
  }

  /* 标签 */
  if (showLabels) {
    if (gNeedLabels) { gLayoutLabels(); gNeedLabels = false; }
    gctx.textBaseline = "middle";
    for (const L of glabels) {
      if (L.z <= 0.02) continue;
      gctx.font = L.fs + "px 'Microsoft YaHei',system-ui,sans-serif";
      gctx.textAlign = L.align;
      gctx.lineWidth = 3;
      gctx.strokeStyle = "rgba(5,9,18,.92)";
      gctx.strokeText(L.text, L.x, L.y);
      gctx.fillStyle = L.color;
      gctx.fillText(L.text, L.x, L.y);
    }
  }

  const stat = document.getElementById("statLine");
  if (stat) stat.textContent = T("stat", CITIES.length, shown, dayCnt, shown - dayCnt);
}

function gLayoutLabels() {
  const fs = gview.zoom > 2.4 ? 12 : 10.5;
  const tier = gTier();
  const cands = [];
  for (const c of CITIES) {
    if (c.lv > tier || !(c._gz > 0.06)) continue;
    if (!hasLabel(c)) continue;
    cands.push(c);
  }
  cands.sort((a, b) => (a.lv - b.lv) || ((b.p || 0) - (a.p || 0)));

  const boxes = [];
  glabels = [];
  const wpx = wrap.clientWidth, hpx = wrap.clientHeight;
  const capG = Math.max(12, Math.min(160, Math.round((wpx * hpx) / 3000)));
  for (const c of cands) {
    if (glabels.length >= capG) break;
    const text = cityName(c);
    const w = text.length * fs * 0.6 + 6;
    const tries = [
      { x: c._gx + 7, y: c._gy, a: "left" },
      { x: c._gx - 7, y: c._gy, a: "right" },
      { x: c._gx, y: c._gy + fs * 1.2, a: "center" },
      { x: c._gx, y: c._gy - fs * 1.1, a: "center" }
    ];
    for (const t of tries) {
      const bx = t.a === "right" ? t.x - w : t.a === "center" ? t.x - w / 2 : t.x;
      const box = { x: bx, y: t.y - fs * 0.75, w, h: fs * 1.5 };
      if (box.x < 4 || box.x + box.w > wpx - 4) continue;
      if (box.y < 4 || box.y + box.h > hpx - 4) continue;
      let clash = false;
      for (const b of boxes) {
        if (box.x < b.x + b.w && box.x + box.w > b.x && box.y < b.y + b.h && box.y + box.h > b.y) { clash = true; break; }
      }
      if (clash) continue;
      boxes.push(box);
      glabels.push({
        text, x: t.x, y: t.y, z: c._gz, fs, align: t.a,
        color: "rgba(186,203,228,.62)"      // 与平面版统一：柔和的灰蓝
      });
      break;
    }
  }
}

function gHit(x, y, rad) {
  const tier = gTier();
  let best = null, bd = rad * rad;
  for (const c of CITIES) {
    if (c.lv > tier) continue;
    const p = gProject(c.la, c.lo, gp);
    if (p.z <= 0.05) continue;
    const dx = p.x - x, dy = p.y - y;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}

function gShowTip(c, clientX, clientY) {
  tip.innerHTML = cityTipHTML({ c, isDay: c._gDay }, new Date());
  tip.classList.add("show");
  moveTip({ clientX, clientY });
}
function gHideTip() { tip.classList.remove("show"); }

/* ---- 地球视图交互 ---- */
let gDrag = false, gMoved = 0, gLastX = 0, gLastY = 0;
const gPointers = new Map();
let gPinch = 0, gLabelTimer = 0;

wrap.addEventListener("pointerdown", ev => {
  if (window.__mode !== "globe") return;
  if (ev.button !== undefined && ev.button !== 0) return;
  gPointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  try { wrap.setPointerCapture(ev.pointerId); } catch (e) { /* 忽略 */ }
  if (gPointers.size === 1) {
    gDrag = true; gMoved = 0;
    gLastX = ev.clientX; gLastY = ev.clientY;
    wrap.classList.add("dragging");
    gHideTip();
  } else if (gPointers.size === 2) {
    gPinch = gPtrDist();
  }
});

function gPtrDist() {
  const a = [...gPointers.values()];
  return a.length < 2 ? 0 : Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
}

wrap.addEventListener("pointermove", ev => {
  if (window.__mode !== "globe") return;
  const p = gPointers.get(ev.pointerId);
  if (!p) {
    if (!coarse) {
      const r = wrap.getBoundingClientRect();
      const c = gHit(ev.clientX - r.left, ev.clientY - r.top, 14);
      if (c) gShowTip(c, ev.clientX, ev.clientY);
      else gHideTip();
    }
    return;
  }
  const dx = ev.clientX - p.x, dy = ev.clientY - p.y;
  p.x = ev.clientX; p.y = ev.clientY;

  if (gPointers.size === 1) {
    gMoved += Math.abs(dx) + Math.abs(dy);
    if (gMoved > 3) {
      const k = 0.22 / gview.zoom;
      gview.lon -= dx * k;
      gview.lat = Math.max(-85, Math.min(85, gview.lat + dy * k));
      gNeedLabels = true;
      gRender();
      clearTimeout(gLabelTimer);
      gLabelTimer = setTimeout(() => { gNeedLabels = true; gRender(); }, 160);
    }
  } else if (gPointers.size === 2) {
    const d = gPtrDist();
    if (gPinch > 5 && d > 5) {
      gview.zoom = Math.max(G_MIN, Math.min(G_MAX, gview.zoom * (d / gPinch)));
      gNeedLabels = true;
      gRender();
    }
    gPinch = d;
  }
});

function gRelease(ev) {
  if (window.__mode !== "globe") return;
  if (!gPointers.has(ev.pointerId)) return;
  gPointers.delete(ev.pointerId);
  if (gPointers.size === 0) {
    gDrag = false;
    wrap.classList.remove("dragging");
    clearTimeout(gLabelTimer);
    gLabelTimer = setTimeout(() => { gNeedLabels = true; gRender(); }, 160);
    if (gMoved < 6) {
      const r = wrap.getBoundingClientRect();
      const c = gHit(ev.clientX - r.left, ev.clientY - r.top, coarse ? 30 : 16);
      if (c) gShowTip(c, ev.clientX, ev.clientY);
      else gHideTip();
    }
  } else if (gPointers.size === 1) {
    gPinch = 0;
  }
}
wrap.addEventListener("pointerup", gRelease);
wrap.addEventListener("pointercancel", gRelease);

wrap.addEventListener("wheel", ev => {
  if (window.__mode !== "globe") return;
  ev.preventDefault();
  const f = Math.exp(-ev.deltaY * (ev.deltaMode === 1 ? 0.05 : 0.0016));
  gview.zoom = Math.max(G_MIN, Math.min(G_MAX, gview.zoom * f));
  gNeedLabels = true;
  gRender();
  clearTimeout(gLabelTimer);
  gLabelTimer = setTimeout(() => { gNeedLabels = true; gRender(); }, 160);
}, { passive: false });

wrap.addEventListener("dblclick", ev => {
  if (window.__mode !== "globe") return;
  ev.preventDefault();
  gview.zoom = gview.zoom >= G_MAX - 0.05 ? 1 : Math.min(G_MAX, gview.zoom * 2.2);
  gNeedLabels = true;
  gRender();
});

/* ---- 对外接口 ---- */
function gFocusTo(lat, lon, zoom) {
  gview.lat = Math.max(-85, Math.min(85, lat));
  gview.lon = lon;
  gview.zoom = Math.max(G_MIN, Math.min(G_MAX, zoom));
  gNeedLabels = true;
  gRender();
}

const Globe = {
  resize() { gResize(); gRender(); },
  render() { gRender(); },
  setLang() { gNeedLabels = true; if (window.__mode === "globe") gRender(); },
  setNight(on) { gNightOn = on; if (window.__mode === "globe") { gNeedLabels = true; gRender(); } },
  focusCity(c) {
    const dz = Math.max(3.2, gview.zoom);
    gFocusTo(c.la, c.lo, dz);
    setTimeout(() => {
      const r = wrap.getBoundingClientRect();
      const p = gProject(c.la, c.lo, gp);
      gShowTip(c, r.left + p.x, r.top + p.y);
    }, 60);
  },
  focusRegion(name) {
    if (name === "全部") { gFocusTo(20, 105, 1); return; }
    const pts = CITIES.filter(c => c.co === name);
    if (!pts.length) { gFocusTo(20, 105, 1); return; }
    let lat = 0, lon = 0;
    for (const c of pts) { lat += c.la; lon += c.lo; }
    lat /= pts.length; lon /= pts.length;
    let span = 0;
    for (const c of pts) {
      span = Math.max(span, Math.abs(c.la - lat), Math.abs(((c.lo - lon + 540) % 360) - 180));
    }
    const zoom = Math.max(1, Math.min(3.6, 62 / Math.max(8, span)));
    gFocusTo(lat, lon, zoom);
  }
};
window.Globe = Globe;

/* ---- 模式切换 ---- */
function setViewMode(m) {
  window.__mode = m;
  wrap.classList.toggle("globe", m === "globe");
  const btn = document.getElementById("tgGlobe");
  if (btn) btn.textContent = m === "globe" ? T("tgFlat") : T("tgGlobe");
  const sub = document.querySelector(".sub");
  if (sub) sub.textContent = m === "globe" ? T("subGlobe") : (coarse ? T("subTouch") : T("subFlat"));
  tip.classList.remove("show");
  if (m === "globe") {
    gNeedLabels = true;
    gRender();
  } else {
    applyMarkerScale();
    placeSun(Date.now());
    drawNight(Date.now());
  }
}
document.getElementById("tgGlobe").addEventListener("click", () => {
  setViewMode(window.__mode === "globe" ? "flat" : "globe");
});

/* =========================================================
   14. 语言切换
   ========================================================= */
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = lang === "zh" ? "世界时间地图" : "World Time Map";

  const h1 = document.querySelector("header h1");
  if (h1) h1.innerHTML = `${T("titleA")}<span>${T("titleB")}</span>`;
  const sub = document.querySelector(".sub");
  if (sub) sub.textContent = window.__mode === "globe"
    ? T("subGlobe") : (coarse ? T("subTouch") : T("subFlat"));

  const inp = document.getElementById("citySearch");
  if (inp) inp.placeholder = T("search");

  const bNight = document.getElementById("tgNight");
  if (bNight) bNight.innerHTML = `<span class="dot"></span>${T("tgNight")}`;
  const bLabels = document.getElementById("tgLabels");
  if (bLabels) bLabels.innerHTML = `<span class="dot"></span>${T("tgLabels")}`;
  const bGlobe = document.getElementById("tgGlobe");
  if (bGlobe) bGlobe.textContent = window.__mode === "globe" ? T("tgFlat") : T("tgGlobe");
  const bLang = document.getElementById("tgLang");
  if (bLang) bLang.textContent = T("langBtn");
  const rh = document.getElementById("rotateHint");
  if (rh) rh.textContent = T("rotateHint");

  const tabs = document.getElementById("refTabs");
  if (tabs) {
    const map = { local: T("tabLocal"), UTC: T("tabUTC") };
    [...tabs.querySelectorAll("button")].forEach(b => {
      if (b.dataset.ref) b.textContent = map[b.dataset.ref] || b.textContent;
    });
  }

  const legend = document.querySelector(".legend");
  if (legend) {
    legend.innerHTML =
      `<span><i style="background:#f5b942;box-shadow:0 0 8px #f5b942"></i>${T("day")}</span>` +
      `<span><i style="background:#6ea8fe;box-shadow:0 0 8px #6ea8fe"></i>${T("night")}</span>` +
      `<span><i style="background:#243a5c"></i>${T("shade")}</span>` +
      `<span style="color:#5d6f8c">·</span><span id="statLine">—</span>`;
  }
  EMPTY_PIN = `<span class="empty">${coarse ? T("pinsEmptyTouch") : T("pinsEmpty")}</span>`;

  renderChips();
  refreshCityText();
  refreshWaterText();
  renderRefClock(new Date());
  applyMarkerScale();
  paintCities(Date.now());
  buildPins();
  if (tip.classList.contains("show") && hovered) tip.innerHTML = cityTipHTML(hovered, new Date());
  if (window.Globe && window.Globe.setLang) window.Globe.setLang();
}

document.getElementById("tgLang").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  try { localStorage.setItem("wtm-lang", lang); } catch (e) { /* 忽略 */ }
  applyLang();
});

/* 竖屏提示：点一下关掉，本次会话不再出现 */
(function rotateHintInit() {
  const el = document.getElementById("rotateHint");
  if (!el) return;
  try {
    if (sessionStorage.getItem("wtm-rotate-hint") === "off") el.classList.add("hide");
  } catch (e) { /* 忽略 */ }
  el.addEventListener("click", () => {
    el.classList.add("hide");
    try { sessionStorage.setItem("wtm-rotate-hint", "off"); } catch (e) { /* 忽略 */ }
  });
})();

applyLang();

/* 默认打开就是地球模式：切换按钮的文案、副标题、画布都走同一套逻辑 */
setViewMode("globe");
</script>
